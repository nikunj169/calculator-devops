# Full stack: two calculator API replicas behind an Nginx reverse proxy.
#   docker compose up -d        -> start (or update) the stack
#   curl localhost:8090/api/v1/add?a=2&b=3
name: calculator-devops

services:
  calculator:
    image: ${DOCKER_IMAGE:-niki9937/calculator-devops}:${IMAGE_TAG:-latest}
    deploy:
      replicas: 2
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: calculator
      APP_BUILD: ${IMAGE_TAG:-latest}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      TZ: Asia/Kolkata
    expose:
      - "8080"
    networks:
      - calculator-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      calculator:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8090}:80"
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calculator-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  calculator-net:
    driver: bridge
