# Reverse proxy in front of the calculator replicas.
# Docker's embedded DNS (127.0.0.11) returns every replica of the "calculator"
# service; resolving per request (via a variable) round-robins across them and
# picks up new container IPs after a redeploy without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $calculator_upstream http://calculator:8080;

    location / {
        proxy_pass $calculator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream-Addr $upstream_addr always;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
